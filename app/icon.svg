<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="chart" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(80, 120)">
    <!-- Chart line -->
    <path d="M0 220 L80 180 L160 200 L240 80 L320 120 L352 40"
          stroke="url(#chart)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Moon -->
    <circle cx="280" cy="60" r="50" fill="#fbbf24"/>
    <circle cx="310" cy="45" r="45" fill="url(#bg)"/>
  </g>
