<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="60%" cy="35%" r="40%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Moon glow -->
  <rect width="512" height="512" rx="115" fill="url(#moonGlow)"/>

  <!-- Simple Crescent Moon -->
  <circle cx="256" cy="200" r="120" fill="#fbbf24"/>
  <circle cx="310" cy="165" r="110" fill="#0f172a"/>

  <!-- Simple upward trend line -->
  <path d="M100 400 L220 300 L320 340 L410 240"
        stroke="#22c55e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Arrow head -->
  <path d="M380 255 L410 240 L400 270"
        stroke="#22c55e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
